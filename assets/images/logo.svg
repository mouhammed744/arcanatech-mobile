    <line x1="248" y1="233" x2="285" y2="233" stroke="#0D1B2A" stroke-width="1" opacity="0.35"/>
    <line x1="248" y1="250" x2="285" y2="250" stroke="#0D1B2A" stroke-width="1" opacity="0.35"/>
    <line x1="248" y1="267" x2="285" y2="267" stroke="#0D1B2A" stroke-width="1" opacity="0.35"/>
    <line x1="248" y1="284" x2="285" y2="284" stroke="#0D1B2A" stroke-width="1" opacity="0.35"/>
    <line x1="248" y1="301" x2="285" y2="301" stroke="#0D1B2A" stroke-width="1" opacity="0.35"/>
    <line x1="248" y1="318" x2="285" y2="318" stroke="#0D1B2A" stroke-width="1" opacity="0.35"/>
    <line x1="235" y1="210" x2="251" y2="210" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="235" y1="227" x2="251" y2="227" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="235" y1="244" x2="251" y2="244" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="235" y1="261" x2="251" y2="261" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="235" y1="278" x2="251" y2="278" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="235" y1="295" x2="251" y2="295" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="235" y1="312" x2="251" y2="312" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="282" y1="225" x2="296" y2="225" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="282" y1="245" x2="306" y2="245" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="282" y1="265" x2="306" y2="265" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="282" y1="285" x2="306" y2="285" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="282" y1="305" x2="306" y2="305" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
    <line x1="282" y1="325" x2="296" y2="325" stroke="#0D1B2A" stroke-width="0.8" opacity="0.3"/>
  </g>
</svg>