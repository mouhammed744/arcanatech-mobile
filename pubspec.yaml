name: arcana_mobile
description: ARCANA TECH - Application étudiante
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management ──────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── HTTP & API ────────────────────────────────────────
  dio: ^5.4.3+1

  # ── Navigation ───────────────────────────────────────
  go_router: ^14.2.0

  # ── Storage ──────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # ── UI / Design ──────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # ── Icons ────────────────────────────────────────────
  cupertino_icons: ^1.0.6
  iconsax_flutter: ^1.0.1
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.10+1

  # ── Media / Camera ───────────────────────────────────
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3

  # ── Audio ─────────────────────────────────────────────
  audioplayers: ^6.1.0

  # ── Firebase / Notifications ─────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # ── OAuth Social Login ───────────────────────────────
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  flutter_web_auth_2: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
